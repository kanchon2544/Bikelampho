<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ / ลงทะเบียน</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .btn {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #218838;
        }
        .social-login {
            display: flex;
            flex-direction: column;
        }
        .google, .facebook {
            background: #007bff;
            color: white;
            margin-bottom: 10px;
        }
        .google:hover { background: #0056b3; }
        .facebook { background: #3b5998; }
        .facebook:hover { background: #2d4373; }
    </style>
</head>
<body>
    <div class="container">
        <h2>เข้าสู่ระบบ / ลงทะเบียน</h2>
        <input type="tel" id="phone" placeholder="เบอร์โทร" maxlength="10">
        <input type="password" id="password" placeholder="รหัสผ่าน (ตัวเลข 6 ตัว)" maxlength="6">
        <button class="btn" onclick="loginRegister()">เข้าสู่ระบบ / ลงทะเบียน</button>
        <div class="social-login">
            <button class="google" onclick="googleLogin()">เข้าสู่ระบบด้วย Google</button>
            <button class="facebook" onclick="facebookLogin()">เข้าสู่ระบบด้วย Facebook</button>
        </div>
    </div>
    
    <script>
        function loginRegister() {
            let phone = document.getElementById("phone").value;
            let password = document.getElementById("password").value;
            if (phone.length !== 10 || password.length !== 6) {
                alert("กรุณากรอกข้อมูลให้ถูกต้อง");
                return;
            }
            localStorage.setItem("loggedIn", "true");
            localStorage.setItem("userPhone", phone);
            alert("เข้าสู่ระบบสำเร็จ!");
            window.location.href = "rental_management.html";
        }

        function googleLogin() {
            alert("เข้าสู่ระบบด้วย Google สำเร็จ!");
            localStorage.setItem("loggedIn", "true");
            window.location.href = "rental_management.html";
        }

        function facebookLogin() {
            alert("เข้าสู่ระบบด้วย Facebook สำเร็จ!");
            localStorage.setItem("loggedIn", "true");
            window.location.href = "rental_management.html";
        }
    </script>
</body>
</html>
