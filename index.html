<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>การจองเช่าจักรยาน</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-image: url(gta.jpg);
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    flex-direction: column;
    padding: 10px;
}

.container {
    background: rgba(255, 255, 255, 0.95);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 12px rgba(0, 0, 0, 0.2);
    text-align: center;
    max-width: 500px;
    width: 100%;
}

.clock {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
    color: #333;
}

input, select, button {
    margin: 8px 0;
    padding: 12px;
    font-size: 18px;
    width: 100%;
    border-radius: 6px;
    border: 1px solid #ddd;
}

button {
    background: #28a745;
    color: white;
    cursor: pointer;
    border: none;
    font-weight: bold;
}

button:hover {
    background: #218838;
}

.hidden { display: none; }

.closed-message {
    display: none;
    background: #ff4444;
    color: white;
    padding: 12px;
    font-weight: bold;
    border-radius: 6px;
    margin-bottom: 12px;
}

.rental-summary {
    display: none;
    background: white;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 0 12px rgba(0, 0, 0, 0.2);
    text-align: left;
    margin-top: 15px;
    width: 100%;
    max-width: 500px;
}

.summary-item {
    margin: 6px 0;
    font-weight: bold;
}

/* ✅ Responsive Design */
@media screen and (max-width: 768px) {
    .container {
        padding: 15px;
        max-width: 90%;
    }
    .rental-summary {
        max-width: 90%;
    }
    input, select, button {
        font-size: 16px;
        padding: 10px;
    }
    .clock {
        font-size: 20px;
    }
}

@media screen and (max-width: 480px) {
    .container {
        padding: 12px;
        max-width: 95%;
    }
    .rental-summary {
        max-width: 95%;
    }
    input, select, button {
        font-size: 14px;
        padding: 10px;
    }
    .clock {
        font-size: 18px;
    }
}

    </style>
</head>
<body>
    <div class="container">
        <div class="clock" id="clock"></div>
        <button onclick="toggleLanguage()">🇹🇭 / 🇺🇸</button>
        <h2 id="title">การจองเช่าจักรยาน</h2>
        <input type="text" id="bikeNumber" placeholder="หมายเลขจักรยาน / สี">
        <input type="text" id="nickname" placeholder="ชื่อเล่น">
        <input type="text" id="phone" placeholder="เบอร์โทร">
        <select id="paymentMethod" onchange="togglePayment()">
            <option value="cash">เงินสด</option>
            <option value="transfer">โอนเงิน</option>
        </select>
        <input type="number" id="cashAmount" class="hidden" placeholder="ระบุจำนวนเงิน">
        <input type="file" id="slipUpload" class="hidden">
        <select id="rentalTime">
            <option value="1">1 ชั่วโมง</option>
            <option value="2">2 ชั่วโมง</option>
        </select>
        <button onclick="confirmRental()">ยืนยันการจอง</button>
        <p id="rentalInfo" class="hidden"></p>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
            if (hours < 9 || hours >= 20) {
                document.body.innerHTML = '<h1>ตอนนี้ร้านปิดแล้ว กรุณามาใช้บริการใหม่อีกวัน</h1>';
            }
        }
        setInterval(updateClock, 1000);

        function togglePayment() {
            const method = document.getElementById("paymentMethod").value;
            document.getElementById("cashAmount").classList.toggle("hidden", method !== "cash");
            document.getElementById("slipUpload").classList.toggle("hidden", method !== "transfer");
        }

        function confirmRental() {
            const bike = document.getElementById("bikeNumber").value;
            const name = document.getElementById("nickname").value;
            const phone = document.getElementById("phone").value;
            const method = document.getElementById("paymentMethod").value;
            const amount = document.getElementById("cashAmount").value;
            const time = document.getElementById("rentalTime").value;
            const now = new Date().toLocaleString();
            let info = `จักรยาน: ${bike}, ชื่อเล่น: ${name}, เบอร์โทร: ${phone}, วิธีชำระเงิน: ${method}, ระยะเวลา: ${time} ชั่วโมง, เวลาจอง: ${now}`;
            if (method === "cash") info += `, จำนวนเงิน: ${amount} บาท`;
            document.getElementById("rentalInfo").textContent = info;
            document.getElementById("rentalInfo").classList.remove("hidden");
        }

        function toggleLanguage() {
            const lang = document.getElementById("title").textContent === "การจองเช่าจักรยาน" ? "en" : "th";
            document.getElementById("title").textContent = lang === "th" ? "การจองเช่าจักรยาน" : "Bike Rental Booking";
            document.getElementById("bikeNumber").placeholder = lang === "th" ? "หมายเลขจักรยาน / สี" : "Bike Number / Color";
            document.getElementById("nickname").placeholder = lang === "th" ? "ชื่อเล่น" : "Nickname";
            document.getElementById("phone").placeholder = lang === "th" ? "เบอร์โทร" : "Phone Number";
            document.getElementById("paymentMethod").options[0].text = lang === "th" ? "เงินสด" : "Cash";
            document.getElementById("paymentMethod").options[1].text = lang === "th" ? "โอนเงิน" : "Transfer";
            document.getElementById("cashAmount").placeholder = lang === "th" ? "ระบุจำนวนเงิน" : "Enter Amount";
            document.getElementById("rentalTime").options[0].text = lang === "th" ? "1 ชั่วโมง" : "1 Hour";
            document.getElementById("rentalTime").options[1].text = lang === "th" ? "2 ชั่วโมง" : "2 Hours";
        }
    </script>
</body>
</html>
