<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Rental Booking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 20px;
            margin: 20px auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        .clock {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: black;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 18px;
        }
        h1 {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 10px;
            text-align: left;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
            cursor: pointer;
        }
        button:disabled {
            background: gray;
            cursor: not-allowed;
        }
        .hidden {
            display: none;
        }
        .language-switch {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .language-switch button {
            background: none;
            border: none;
            cursor: pointer;
            margin: 0 5px;
        }
        .language-switch img {
            width: 30px;
            height: 30px;
        }
    </style>
</head>
<body>

    <!-- ปุ่มเปลี่ยนภาษา -->
    <div class="language-switch">
        <button onclick="changeLanguage('th')"><img src="th.png" alt="TH"></button>
        <button onclick="changeLanguage('en')"><img src="en.png" alt="EN"></button>
    </div>

    <div class="container">
        <div class="clock" id="clock"></div>

        <h1 id="title">การจองเช่าจักรยาน</h1>

        <form id="rentalForm">
            <label for="bikeNumber">หมายเลขจักรยาน / สีจักรยาน</label>
            <input type="text" id="bikeNumber" required>

            <label for="nickname">ชื่อเล่น</label>
            <input type="text" id="nickname" required>

            <label for="phone">เบอร์โทร</label>
            <input type="tel" id="phone" required>

            <label for="payment">วิธีชำระเงิน</label>
            <select id="payment" onchange="togglePaymentFields()" required>
                <option value="cash">เงินสด</option>
                <option value="transfer">โอนเงิน</option>
            </select>

            <div id="cashAmount" class="hidden">
                <label for="amount">จำนวนเงิน (บาท)</label>
                <input type="number" id="amount">
            </div>

            <div id="transferSlip" class="hidden">
                <label for="slip">อัปโหลดสลิปโอนเงิน</label>
                <input type="file" id="slip">
            </div>

            <label for="rentalTime">ระยะเวลาเช่า</label>
            <select id="rentalTime" required>
                <option value="1">1 ชั่วโมง</option>
                <option value="2">2 ชั่วโมง</option>
                <option value="3">3 ชั่วโมง</option>
                <option value="4">4 ชั่วโมง</option>
                <option value="5">5 ชั่วโมง</option>
                <option value="6">6 ชั่วโมง</option>
                <option value="day">1 วัน</option>
            </select>

            <label for="note">หมายเหตุ</label>
            <textarea id="note"></textarea>

            <button type="submit" id="confirmBtn">ยืนยันการจอง</button>
        </form>

        <!-- แสดงข้อมูลการจอง -->
        <div id="bookingDetails" class="hidden">
            <h2>ข้อมูลการจอง</h2>
            <p><strong>หมายเลขจักรยาน:</strong> <span id="displayBikeNumber"></span></p>
            <p><strong>ชื่อเล่น:</strong> <span id="displayNickname"></span></p>
            <p><strong>เบอร์โทร:</strong> <span id="displayPhone"></span></p>
            <p><strong>วิธีชำระเงิน:</strong> <span id="displayPayment"></span></p>
            <p><strong>ระยะเวลาเช่า:</strong> <span id="displayRentalTime"></span></p>
            <p><strong>หมายเหตุ:</strong> <span id="displayNote"></span></p>
            <p><strong>เวลาการจอง:</strong> <span id="displayBookingTime"></span></p>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const formattedTime = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
            document.getElementById("clock").innerText = formattedTime;

            const confirmBtn = document.getElementById("confirmBtn");
            if (hours < 9 || hours >= 20) {
                confirmBtn.disabled = true;
            } else {
                confirmBtn.disabled = false;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        function changeLanguage(lang) {
            const translations = {
                en: { title: "Bike Rental Booking", confirmBtn: "Confirm Booking" },
                th: { title: "การจองเช่าจักรยาน", confirmBtn: "ยืนยันการจอง" }
            };
            document.getElementById("title").innerText = translations[lang].title;
            document.getElementById("confirmBtn").innerText = translations[lang].confirmBtn;
        }

        function togglePaymentFields() {
            const paymentMethod = document.getElementById("payment").value;
            document.getElementById("cashAmount").classList.toggle("hidden", paymentMethod !== "cash");
            document.getElementById("transferSlip").classList.toggle("hidden", paymentMethod !== "transfer");
        }

        document.getElementById("rentalForm").addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("displayBikeNumber").innerText = document.getElementById("bikeNumber").value;
            document.getElementById("displayNickname").innerText = document.getElementById("nickname").value;
            document.getElementById("displayPhone").innerText = document.getElementById("phone").value;
            document.getElementById("displayPayment").innerText = document.getElementById("payment").value;
            document.getElementById("displayRentalTime").innerText = document.getElementById("rentalTime").value;
            document.getElementById("displayNote").innerText = document.getElementById("note").value;
            document.getElementById("displayBookingTime").innerText = new Date().toLocaleString();

            document.getElementById("bookingDetails").classList.remove("hidden");
        });
    </script>

</body>
</html>
