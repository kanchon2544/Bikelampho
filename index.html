<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช่าจักรยาน เกาะลำพู</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: url(gta.jpg) no-repeat center center/cover;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }
        .language-switch {
            text-align: right;
            margin-bottom: 10px;
        }
        .language-switch button {
            border: none;
            padding: 5px 10px;
            margin: 2px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 5px;
        }
        h2 {
            text-align: center;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            font-size: 16px;
        }
        .confirm-button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="language-switch">
            <button onclick="switchLanguage('th')">ไทย</button>
            <button onclick="switchLanguage('en')">English</button>
        </div>
        <h2 id="title">เช่าจักรยาน</h2>
        
        <label id="bikeLabel">หมายเลขจักรยาน / สีจักรยาน</label>
        <input type="text" id="bikeNumber" placeholder="หมายเลขจักรยาน">
        <input type="text" id="color" placeholder="สีจักรยาน">

        <label id="startLabel">เวลาเริ่มเช่า</label>
        <input type="datetime-local" id="startTime">
        <label id="endLabel">เวลาคืนจักรยาน</label>
        <input type="datetime-local" id="endTime">

        <label id="nameLabel">ชื่อเล่น</label>
        <input type="text" id="nickname" placeholder="ชื่อเล่น">

        <label id="phoneLabel">เบอร์โทร</label>
        <input type="tel" id="phone" placeholder="เบอร์โทร">

        <label id="paymentLabel">วิธีการชำระเงิน</label>
        <select id="paymentMethod">
            <option value="cash">เงินสด</option>
            <option value="transfer">โอน</option>
        </select>
        
        <input type="number" id="cashAmount" placeholder="จำนวนเงิน" style="display: none;">
        <input type="file" id="transferSlip" accept="image/*" style="display: none;">
        
        <label id="durationLabel">จำนวนชั่วโมงที่เช่า</label>
        <select id="rentalDuration">
            <option value="1 hour">1 ชั่วโมง</option>
            <option value="2 hours">2 ชั่วโมง</option>
            <option value="1 day">1 วัน</option>
        </select>

        <label id="returnLabel">
            <input type="checkbox" id="returnBike"> คืนจักรยาน
        </label>

        <label id="noteLabel">หมายเหตุ</label>
        <input type="text" id="notes" placeholder="หมายเหตุ">

        <button class="confirm-button" onclick="confirmBooking()">ยืนยันการจอง</button>
    </div>

    <script>
        function switchLanguage(lang) {
            const translations = {
                th: {
                    title: "เช่าจักรยาน",
                    bikeLabel: "หมายเลขจักรยาน / สีจักรยาน",
                    startLabel: "เวลาเริ่มเช่า",
                    endLabel: "เวลาคืนจักรยาน",
                    nameLabel: "ชื่อเล่น",
                    phoneLabel: "เบอร์โทร",
                    paymentLabel: "วิธีการชำระเงิน",
                    durationLabel: "จำนวนชั่วโมงที่เช่า",
                    returnLabel: "คืนจักรยาน",
                    noteLabel: "หมายเหตุ"
                },
                en: {
                    title: "Bike Rental Booking",
                    bikeLabel: "Bike Number / Color",
                    startLabel: "Start Time",
                    endLabel: "Return Time",
                    nameLabel: "Nickname",
                    phoneLabel: "Phone Number",
                    paymentLabel: "Payment Method",
                    durationLabel: "Rental Duration",
                    returnLabel: "Return Bike",
                    noteLabel: "Notes"
                }
            };
            
            document.getElementById("title").innerText = translations[lang].title;
            document.getElementById("bikeLabel").innerText = translations[lang].bikeLabel;
            document.getElementById("startLabel").innerText = translations[lang].startLabel;
            document.getElementById("endLabel").innerText = translations[lang].endLabel;
            document.getElementById("nameLabel").innerText = translations[lang].nameLabel;
            document.getElementById("phoneLabel").innerText = translations[lang].phoneLabel;
            document.getElementById("paymentLabel").innerText = translations[lang].paymentLabel;
            document.getElementById("durationLabel").innerText = translations[lang].durationLabel;
            document.getElementById("returnLabel").innerText = translations[lang].returnLabel;
            document.getElementById("noteLabel").innerText = translations[lang].noteLabel;
        }
    </script>
</body>
</html>
