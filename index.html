<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช่าจักรยาน เกาะลำพู</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: url('gta.jpg') no-repeat center center/cover;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }
        h2 {
            text-align: center;
            color: #333;
            font-weight: bold;
        }
        label {
            font-weight: 600;
            display: block;
            margin-top: 10px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        .confirm-button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            background: linear-gradient(135deg, #28a745, #218838);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }
        .confirm-button:hover {
            background: linear-gradient(135deg, #218838, #1e7e34);
        }
        .receipt {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
            text-align: center;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="container">
        <button onclick="toggleLanguage()">เปลี่ยนภาษา / Change Language</button>
        <h2 id="title">Bike Rental Booking</h2>
        <label id="bikeLabel">หมายเลขจักรยาน / สีจักรยาน</label>
        <input type="text" id="bikeNumber" placeholder="หมายเลขจักรยาน">
        <input type="text" id="color" placeholder="สีจักรยาน">
        <label id="nicknameLabel">ชื่อเล่น</label>
        <input type="text" id="nickname" placeholder="ชื่อเล่น">
        <label id="phoneLabel">เบอร์โทร</label>
        <input type="tel" id="phone" placeholder="เบอร์โทร">
        <label id="paymentLabel">วิธีการชำระเงิน</label>
        <select id="paymentMethod" onchange="togglePayment()">
            <option value="cash">เงินสด</option>
            <option value="transfer">โอน</option>
        </select>
        <input type="number" id="cashAmount" placeholder="จำนวนเงิน" style="display: none;">
        <input type="file" id="transferSlip" accept="image/*" style="display: none;">
        <label id="rentalLabel">จำนวนชั่วโมงที่เช่า</label>
        <select id="rentalDuration">
            <option value="1 hour">1 ชั่วโมง</option>
            <option value="2 hours">2 ชั่วโมง</option>
            <option value="3 hours">3 ชั่วโมง</option>
            <option value="4 hours">4 ชั่วโมง</option>
            <option value="5 hours">5 ชั่วโมง</option>
            <option value="6 hours">6 ชั่วโมง</option>
            <option value="1 day">1 วัน</option>
        </select>
        <label id="notesLabel">หมายเหตุ</label>
        <input type="text" id="notes" placeholder="หมายเหตุ">
        <button class="confirm-button" onclick="confirmBooking()">ยืนยันการจอง!!</button>
    </div>
    <script>
        function toggleLanguage() {
            const isEnglish = document.getElementById('title').innerText === "Bike Rental Booking";
            document.getElementById('title').innerText = isEnglish ? "เช่าจักรยาน" : "Bike Rental Booking";
            document.getElementById('bikeLabel').innerText = isEnglish ? "หมายเลขจักรยาน / สีจักรยาน" : "Bike Number / Color";
            document.getElementById('nicknameLabel').innerText = isEnglish ? "ชื่อเล่น" : "Nickname";
            document.getElementById('phoneLabel').innerText = isEnglish ? "เบอร์โทร" : "Phone Number";
            document.getElementById('paymentLabel').innerText = isEnglish ? "วิธีการชำระเงิน" : "Payment Method";
            document.getElementById('rentalLabel').innerText = isEnglish ? "จำนวนชั่วโมงที่เช่า" : "Rental Duration";
            document.getElementById('notesLabel').innerText = isEnglish ? "หมายเหตุ" : "Notes";
        }
        function togglePayment() {
            let method = document.getElementById("paymentMethod").value;
            document.getElementById("cashAmount").style.display = method === "cash" ? "block" : "none";
            document.getElementById("transferSlip").style.display = method === "transfer" ? "block" : "none";
        }
        function confirmBooking() {
            alert("การจองสำเร็จ!");
        }
    </script>
</body>
</html>
