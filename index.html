<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช่าจักรยาน เกาะลำพู</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: url('gta.jpg') no-repeat center center/cover;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #333;
            font-weight: bold;
        }
        label {
            font-weight: 600;
            display: block;
            margin-top: 10px;
            text-align: left;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        .confirm-button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            background: linear-gradient(135deg, #28a745, #218838);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }
        .confirm-button:hover {
            background: linear-gradient(135deg, #218838, #1e7e34);
        }
        .receipt {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
            text-align: center;
            max-width: 400px;
        }
        .language-switcher {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .language-switcher button {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .lang-th { background-color: #ffc107; }
        .lang-en { background-color: #007bff; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="language-switcher">
            <button class="lang-th" onclick="changeLanguage('th')">ไทย</button>
            <button class="lang-en" onclick="changeLanguage('en')">English</button>
        </div>
        <h2 id="title">Bike Rental Booking</h2>
        <label id="label-bike">หมายเลขจักรยาน / สีจักรยาน</label>
        <input type="text" id="bikeNumber" placeholder="หมายเลขจักรยาน">
        <input type="text" id="color" placeholder="สีจักรยาน">

        <label id="label-nickname">ชื่อเล่น</label>
        <input type="text" id="nickname" placeholder="ชื่อเล่น">

        <label id="label-phone">เบอร์โทร</label>
        <input type="tel" id="phone" placeholder="เบอร์โทร">

        <label id="label-payment">วิธีการชำระเงิน</label>
        <select id="paymentMethod" onchange="togglePayment()">
            <option value="cash">เงินสด</option>
            <option value="transfer">โอน</option>
        </select>
        <input type="number" id="cashAmount" placeholder="จำนวนเงิน" style="display: none;">
        <input type="file" id="transferSlip" accept="image/*" style="display: none;">

        <label id="label-duration">จำนวนชั่วโมงที่เช่า</label>
        <select id="rentalDuration">
            <option value="1 hour">1 ชั่วโมง</option>
            <option value="2 hours">2 ชั่วโมง</option>
            <option value="1 day">1 วัน</option>
        </select>

        <label id="label-notes">หมายเหตุ</label>
        <input type="text" id="notes" placeholder="หมายเหตุ">

        <button class="confirm-button" onclick="confirmBooking()">ยืนยันการจอง!!</button>
    </div>

    <div class="receipt" id="receipt">
        <h3>บิลสรุปการเช่า</h3>
        <p id="receiptContent"></p>
    </div>

    <script>
        function togglePayment() {
            let method = document.getElementById("paymentMethod").value;
            document.getElementById("cashAmount").style.display = method === "cash" ? "block" : "none";
            document.getElementById("transferSlip").style.display = method === "transfer" ? "block" : "none";
        }

        function confirmBooking() {
            let bikeNumber = document.getElementById("bikeNumber").value;
            let color = document.getElementById("color").value;
            let nickname = document.getElementById("nickname").value;
            let phone = document.getElementById("phone").value;
            let paymentMethod = document.getElementById("paymentMethod").value;
            let amount = paymentMethod === "cash" ? document.getElementById("cashAmount").value : "โอนเงิน";
            let duration = document.getElementById("rentalDuration").value;
            let notes = document.getElementById("notes").value;

            let receiptText = `หมายเลขจักรยาน: ${bikeNumber}\nสีจักรยาน: ${color}\nชื่อเล่น: ${nickname}\nเบอร์โทร: ${phone}\nวิธีชำระเงิน: ${paymentMethod} (${amount})\nจำนวนชั่วโมงที่เช่า: ${duration}\nหมายเหตุ: ${notes}`;
            document.getElementById("receiptContent").innerText = receiptText;
            document.getElementById("receipt").style.display = "block";
        }
    </script>
</body>
</html>
