<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช่าจักรยาน</title>
    <style>
         body {
            font-family: 'Poppins', sans-serif;
            background: url(gta.jpg) no-repeat center center/cover;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            position: relative;
        }
        .language-switch {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            cursor: pointer;
        }
        .clock {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            background: black;
            color: white;
            padding: 5px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .closed-message {
            display: none;
            padding: 10px;
            background: #ff4444;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            text-align: center;
        }
        .disabled {
            pointer-events: none;
            opacity: 0.6;
        }
        .rental-summary {
            display: none;
            width: 100%;
            max-width: 400px;
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="language-switch" id="languageToggle">🇹🇭</div>
        <div class="clock" id="clock">00:00:00</div>
        <h2 id="title">การจองเช่าจักรยาน</h2>
        <div id="closedMessage" class="closed-message">ตอนนี้ร้านปิดแล้ว กรุณามาใช้บริการใหม่อีกวัน</div>
        
        <label for="bikeNumber">หมายเลขจักรยาน / สี</label>
        <input type="text" id="bikeNumber">
        
        <label for="nickname">ชื่อเล่น</label>
        <input type="text" id="nickname">
        
        <label for="phone">เบอร์โทร</label>
        <input type="text" id="phone">
        
        <label for="payment">วิธีชำระเงิน</label>
        <select id="payment">
            <option value="cash">เงินสด</option>
            <option value="transfer">โอนเงิน</option>
        </select>
        
        <div id="cashAmountContainer" style="display:none;">
            <label for="cashAmount">จำนวนเงิน (บาท)</label>
            <input type="number" id="cashAmount">
        </div>
        
        <div id="slipContainer" style="display:none;">
            <label for="slip">แนบสลิป</label>
            <input type="file" id="slip">
        </div>
        
        <label for="rentalTime">ระยะเวลาเช่า</label>
        <select id="rentalTime">
            <option>1 ชั่วโมง</option>
            <option>2 ชั่วโมง</option>
            <option>3 ชั่วโมง</option>
            <option>4 ชั่วโมง</option>
            <option>5 ชั่วโมง</option>
            <option>6 ชั่วโมง</option>
            <option>1 วัน</option>
        </select>
        
        <button id="submitButton">ยืนยันการจอง</button>
    </div>
    
    <div class="rental-summary" id="rentalSummary">
        <h3>รายละเอียดการเช่า</h3>
        <div>⏳ เวลาจอง: <span id="bookingTime"></span></div>
        <div>🚲 จักรยานหมายเลข: <span id="summaryBikeNumber"></span></div>
        <div>🙋‍♂️ ชื่อเล่น: <span id="summaryNickname"></span></div>
        <div>📞 เบอร์โทร: <span id="summaryPhone"></span></div>
        <div>💰 วิธีชำระเงิน: <span id="summaryPayment"></span></div>
        <div id="summaryCashAmount" style="display:none;">💵 จำนวนเงิน: <span></span> บาท</div>
        <div id="summarySlip" style="display:none;">📄 สลิป: แนบไฟล์แล้ว</div>
        <div>⌛ ระยะเวลาเช่า: <span id="summaryRentalTime"></span></div>
    </div>
    
    <script>
        function updateClock() {
            let now = new Date();
            let hours = now.getHours().toString().padStart(2, '0');
            let minutes = now.getMinutes().toString().padStart(2, '0');
            let seconds = now.getSeconds().toString().padStart(2, '0');
            document.getElementById("clock").innerText = `${hours}:${minutes}:${seconds}`;
            checkStoreStatus(hours);
        }

        function checkStoreStatus(hours) {
            let container = document.querySelector(".container");
            let closedMessage = document.getElementById("closedMessage");
            if (hours >= 20 || hours < 9) {
                container.classList.add("disabled");
                closedMessage.style.display = "block";
            } else {
                container.classList.remove("disabled");
                closedMessage.style.display = "none";
            }
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
