<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช่าจักรยาน</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: url(gta.jpg) no-repeat center center/cover;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            position: relative;
        }
        .language-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: white;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        .clock {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
        }
        .container, .receipt {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            text-align: center;
        }
        label {
            display: block;
            text-align: left;
            margin-top: 10px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .hidden {
            display: none;
        }
        .button {
            margin-top: 15px;
            background: #28a745;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }
        .button:hover {
            background: #218838;
        }
        .closed-message {
            color: red;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <button class="language-toggle" id="langToggle">🇹🇭</button>

    <div class="clock" id="clock">--:--:--</div>

    <div class="container" id="bookingForm">
        <h2>การจองเช่าจักรยาน</h2>

        <label for="bikeNumber">หมายเลขจักรยาน / สี</label>
        <input type="text" id="bikeNumber">

        <label for="nickname">ชื่อเล่น</label>
        <input type="text" id="nickname">

        <label for="phone">เบอร์โทร</label>
        <input type="text" id="phone">

        <label for="payment">วิธีชำระเงิน</label>
        <select id="payment">
            <option value="cash">เงินสด</option>
            <option value="transfer">โอนเงิน</option>
        </select>

        <div id="cashAmountDiv" class="hidden">
            <label for="cashAmount">จำนวนเงิน (บาท)</label>
            <input type="number" id="cashAmount" min="0">
        </div>

        <div id="slipUploadDiv" class="hidden">
            <label for="slipUpload">แนบสลิป</label>
            <input type="file" id="slipUpload" accept="image/*">
        </div>

        <label for="rentalTime">ระยะเวลาเช่า</label>
        <select id="rentalTime">
            <option>1 ชั่วโมง</option>
            <option>2 ชั่วโมง</option>
            <option>3 ชั่วโมง</option>
            <option>4 ชั่วโมง</option>
            <option>5 ชั่วโมง</option>
            <option>6 ชั่วโมง</option>
            <option>1 วัน</option>
        </select>

        <label for="note">หมายเหตุ</label>
        <input type="text" id="note">

        <button class="button" id="submitButton">ยืนยันการจอง</button>
    </div>

    <div class="receipt hidden" id="receipt">
        <h2>✅ รายละเอียดการเช่า</h2>
        <p><strong>หมายเลขจักรยาน:</strong> <span id="rBikeNumber"></span></p>
        <p><strong>ชื่อเล่น:</strong> <span id="rNickname"></span></p>
        <p><strong>เบอร์โทร:</strong> <span id="rPhone"></span></p>
        <p><strong>วิธีชำระเงิน:</strong> <span id="rPayment"></span></p>
        <p id="rCashAmount" class="hidden"><strong>จำนวนเงิน:</strong> <span></span> บาท</p>
        <p><strong>ระยะเวลาเช่า:</strong> <span id="rRentalTime"></span></p>
        <p><strong>หมายเหตุ:</strong> <span id="rNote"></span></p>
        <p><strong>เวลายืนยันการเช่า:</strong> <span id="rTime"></span></p>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            let formattedTime = 
                (hours < 10 ? "0" : "") + hours + ":" + 
                (minutes < 10 ? "0" : "") + minutes + ":" + 
                (seconds < 10 ? "0" : "") + seconds;

            document.getElementById("clock").innerText = formattedTime;
        }

        setInterval(updateClock, 1000);
        updateClock();

        document.getElementById("submitButton").addEventListener("click", function() {
            let now = new Date();
            let timeConfirmed = now.toLocaleTimeString();

            document.getElementById("rBikeNumber").innerText = document.getElementById("bikeNumber").value;
            document.getElementById("rNickname").innerText = document.getElementById("nickname").value;
            document.getElementById("rPhone").innerText = document.getElementById("phone").value;
            document.getElementById("rPayment").innerText = document.getElementById("payment").value;
            document.getElementById("rRentalTime").innerText = document.getElementById("rentalTime").value;
            document.getElementById("rNote").innerText = document.getElementById("note").value;
            document.getElementById("rTime").innerText = timeConfirmed;

            if (document.getElementById("payment").value === "cash") {
                document.getElementById("rCashAmount").classList.remove("hidden");
                document.getElementById("rCashAmount").querySelector("span").innerText = document.getElementById("cashAmount").value;
            } else {
                document.getElementById("rCashAmount").classList.add("hidden");
            }

            document.getElementById("bookingForm").classList.add("hidden");
            document.getElementById("receipt").classList.remove("hidden");
        });
    </script>

</body>
</html>
