<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช่าจักรยาน</title>
    <style>
         body {
            font-family: 'Poppins', sans-serif;
            background: url(gta.jpg) no-repeat center center/cover;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }
        h2 {
            margin-bottom: 10px;
        }
        label {
            display: block;
            text-align: left;
            margin-top: 10px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .button {
            margin-top: 15px;
            background: #28a745;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }
        .button:hover {
            background: #218838;
        }
        .time-display {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            background: black;
            color: white;
            padding: 5px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .closed-message {
            display: none;
            padding: 10px;
            background: #ff4444;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 10px;
        }
        .disabled {
            pointer-events: none;
            opacity: 0.6;
        }
        .rental-summary {
            display: none;
            width: 100%;
            max-width: 400px;
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: left;
        }
        .rental-summary h3 {
            text-align: center;
            margin-bottom: 10px;
        }
        .summary-item {
            margin: 5px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="time-display" id="clock">00:00:00</div>
        <h2 id="title">การจองเช่าจักรยาน</h2>

        <div id="closedMessage" class="closed-message">ตอนนี้ร้านปิดแล้ว กรุณามาใช้บริการใหม่อีกวัน</div>

        <label for="bikeNumber">หมายเลขจักรยาน / สี</label>
        <input type="text" id="bikeNumber">

        <label for="nickname">ชื่อเล่น</label>
        <input type="text" id="nickname">

        <label for="phone">เบอร์โทร</label>
        <input type="text" id="phone">

        <label for="payment">วิธีชำระเงิน</label>
        <select id="payment">
            <option value="cash">เงินสด</option>
            <option value="transfer">โอนเงิน</option>
        </select>

        <label for="rentalTime">ระยะเวลาเช่า</label>
        <select id="rentalTime">
            <option>1 ชั่วโมง</option>
            <option>2 ชั่วโมง</option>
            <option>3 ชั่วโมง</option>
            <option>4 ชั่วโมง</option>
            <option>5 ชั่วโมง</option>
            <option>6 ชั่วโมง</option>
            <option>1 วัน</option>
        </select>

        <label for="note">หมายเหตุ</label>
        <input type="text" id="note">

        <button class="button" id="submitButton">ยืนยันการจอง</button>
    </div>

    <div class="rental-summary" id="rentalSummary">
        <h3>รายละเอียดการเช่า</h3>
        <div class="summary-item">⏳ เวลาจอง: <span id="bookingTime"></span></div>
        <div class="summary-item">🚲 จักรยานหมายเลข: <span id="summaryBikeNumber"></span></div>
        <div class="summary-item">🙋‍♂️ ชื่อเล่น: <span id="summaryNickname"></span></div>
        <div class="summary-item">📞 เบอร์โทร: <span id="summaryPhone"></span></div>
        <div class="summary-item">💰 วิธีชำระเงิน: <span id="summaryPayment"></span></div>
        <div class="summary-item">⌛ ระยะเวลาเช่า: <span id="summaryRentalTime"></span></div>
        <div class="summary-item">📝 หมายเหตุ: <span id="summaryNote"></span></div>
    </div>

    <script>
        function updateClock() {
            let now = new Date();
            let hours = now.getHours().toString().padStart(2, '0');
            let minutes = now.getMinutes().toString().padStart(2, '0');
            let seconds = now.getSeconds().toString().padStart(2, '0');
            let currentTime = `${hours}:${minutes}:${seconds}`;

            document.getElementById("clock").innerText = `เวลาตอนนี้: ${currentTime}`;
            checkStoreStatus(hours);
        }

        function checkStoreStatus(hours) {
            let container = document.querySelector(".container");
            let closedMessage = document.getElementById("closedMessage");
            let submitButton = document.getElementById("submitButton");

            if (hours >= 20 || hours < 9) {
                container.classList.add("disabled");
                closedMessage.style.display = "block";
                submitButton.disabled = true;
            } else {
                container.classList.remove("disabled");
                closedMessage.style.display = "none";
                submitButton.disabled = false;
            }
        }

        document.getElementById("submitButton").addEventListener("click", function() {
            let now = new Date().toLocaleTimeString();
            document.getElementById("bookingTime").innerText = now;
            document.getElementById("summaryBikeNumber").innerText = document.getElementById("bikeNumber").value;
            document.getElementById("summaryNickname").innerText = document.getElementById("nickname").value;
            document.getElementById("summaryPhone").innerText = document.getElementById("phone").value;
            document.getElementById("summaryPayment").innerText = document.getElementById("payment").value;
            document.getElementById("summaryRentalTime").innerText = document.getElementById("rentalTime").value;
            document.getElementById("summaryNote").innerText = document.getElementById("note").value;

            document.getElementById("rentalSummary").style.display = "block";
        });

        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>
</html>
