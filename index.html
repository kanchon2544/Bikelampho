<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช่าจักรยาน</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        }
        .clock {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 10px 20px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.1);
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
        }
        .hidden { display: none; }
        .button {
            margin-top: 15px;
            background: #007bff;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }
        .closed-message {
            font-size: 24px;
            color: red;
            display: none;
        }
        .language-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button class="language-toggle" id="langToggle">🇹🇭</button>
    <div class="clock" id="clock">--:--:--</div>
    <div class="closed-message" id="closedMessage">ตอนนี้ร้านปิดแล้ว กรุณามาใช้บริการใหม่อีกวัน</div>
    <div class="container" id="bookingForm">
        <h2 id="title">การจองเช่าจักรยาน</h2>
        <label id="labelBike">หมายเลขจักรยาน / สี</label>
        <input type="text" id="bikeNumber">
        <label id="labelPayment">วิธีชำระเงิน</label>
        <select id="payment">
            <option value="cash">เงินสด</option>
            <option value="transfer">โอนเงิน</option>
        </select>
        <div id="cashAmountDiv" class="hidden">
            <label id="labelCash">จำนวนเงิน (บาท)</label>
            <input type="number" id="cashAmount" min="0">
        </div>
        <div id="slipUploadDiv" class="hidden">
            <label id="labelSlip">แนบสลิป</label>
            <input type="file" id="slipUpload" accept="image/*">
        </div>
        <button class="button" id="submitButton">ยืนยันการจอง</button>
    </div>
    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let formattedTime = 
                (hours < 10 ? "0" : "") + hours + ":" + 
                (minutes < 10 ? "0" : "") + minutes + ":" + 
                (seconds < 10 ? "0" : "") + seconds;
            document.getElementById("clock").innerText = formattedTime;
            if (hours >= 9 && hours < 20) {
                document.getElementById("closedMessage").style.display = "none";
                document.getElementById("bookingForm").style.display = "block";
            } else {
                document.getElementById("closedMessage").style.display = "block";
                document.getElementById("bookingForm").style.display = "none";
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        document.getElementById("payment").addEventListener("change", function() {
            document.getElementById("cashAmountDiv").classList.toggle("hidden", this.value !== "cash");
            document.getElementById("slipUploadDiv").classList.toggle("hidden", this.value !== "transfer");
        });

        const translations = {
            "th": {
                "title": "การจองเช่าจักรยาน",
                "labelBike": "หมายเลขจักรยาน / สี",
                "labelPayment": "วิธีชำระเงิน",
                "labelCash": "จำนวนเงิน (บาท)",
                "labelSlip": "แนบสลิป",
                "submitButton": "ยืนยันการจอง"
            },
            "en": {
                "title": "Bicycle Rental Booking",
                "labelBike": "Bike Number / Color",
                "labelPayment": "Payment Method",
                "labelCash": "Cash Amount (THB)",
                "labelSlip": "Upload Slip",
                "submitButton": "Confirm Booking"
            }
        };

        let currentLang = "th";
        document.getElementById("langToggle").addEventListener("click", function() {
            currentLang = (currentLang === "th") ? "en" : "th";
            this.innerText = (currentLang === "th") ? "🇹🇭" : "🇺🇸";
            document.getElementById("title").innerText = translations[currentLang]["title"];
            document.getElementById("labelBike").innerText = translations[currentLang]["labelBike"];
            document.getElementById("labelPayment").innerText = translations[currentLang]["labelPayment"];
            document.getElementById("labelCash").innerText = translations[currentLang]["labelCash"];
            document.getElementById("labelSlip").innerText = translations[currentLang]["labelSlip"];
            document.getElementById("submitButton").innerText = translations[currentLang]["submitButton"];
        });
    </script>
</body>
</html>
