<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช่าจักรยาน</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: url(gta.jpg) no-repeat center center/cover;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }
        h2 {
            margin-bottom: 10px;
        }
        label {
            display: block;
            text-align: left;
            margin-top: 10px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .button {
            margin-top: 15px;
            background: #28a745;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }
        .button:hover {
            background: #218838;
        }
        .language-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
        }
        .info-box {
            margin-top: 15px;
            padding: 10px;
            background: #dff0d8;
            border-left: 5px solid #28a745;
            display: none;
        }
        .time-display {
            text-align: center;
            font-size: 14px;
            margin-bottom: 10px;
            background: #000;
            color: white;
            padding: 5px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="thaieng.png" class="language-toggle" width="30" onclick="changeLanguage()">
        <div class="time-display" id="timeDisplay"></div>
        <h2 id="title">การจองเช่าจักรยาน</h2>
        
        <label for="bikeNumber" id="labelBike">หมายเลขจักรยาน / สี</label>
        <input type="text" id="bikeNumber" placeholder="กรอกหมายเลขจักรยาน">

        <label for="nickname" id="labelNickname">ชื่อเล่น</label>
        <input type="text" id="nickname" placeholder="กรอกชื่อเล่น">

        <label for="phone" id="labelPhone">เบอร์โทร</label>
        <input type="text" id="phone" placeholder="กรอกเบอร์โทร">

        <label for="payment" id="labelPayment">วิธีชำระเงิน</label>
        <select id="payment">
            <option value="cash">เงินสด</option>
            <option value="transfer">โอนเงิน</option>
        </select>

        <label for="rentalTime" id="labelRentalTime">ระยะเวลาเช่า</label>
        <select id="rentalTime">
            <option>1 ชั่วโมง</option>
            <option>2 ชั่วโมง</option>
            <option>3 ชั่วโมง</option>
            <option>4 ชั่วโมง</option>
            <option>5 ชั่วโมง</option>
            <option>6 ชั่วโมง</option>
            <option>1 วัน</option>
        </select>

        <label for="note" id="labelNote">หมายเหตุ</label>
        <input type="text" id="note" placeholder="หมายเหตุเพิ่มเติม">

        <button class="button" onclick="confirmBooking()">ยืนยันการจอง</button>

        <div class="info-box" id="infoBox">
            <h3>ข้อมูลการจอง</h3>
            <p id="bookingDetails"></p>
        </div>
    </div>

    <script>
        let currentLang = "th";

        function changeLanguage() {
            const translations = {
                th: {
                    title: "การจองเช่าจักรยาน",
                    bike: "หมายเลขจักรยาน / สี",
                    nickname: "ชื่อเล่น",
                    phone: "เบอร์โทร",
                    payment: "วิธีชำระเงิน",
                    rentalTime: "ระยะเวลาเช่า",
                    note: "หมายเหตุ",
                    confirm: "ยืนยันการจอง"
                },
                en: {
                    title: "Bike Rental Booking",
                    bike: "Bike Number / Color",
                    nickname: "Nickname",
                    phone: "Phone Number",
                    payment: "Payment Method",
                    rentalTime: "Rental Duration",
                    note: "Notes",
                    confirm: "Confirm Booking"
                }
            };

            currentLang = currentLang === "th" ? "en" : "th";

            document.getElementById("title").innerText = translations[currentLang].title;
            document.getElementById("labelBike").innerText = translations[currentLang].bike;
            document.getElementById("labelNickname").innerText = translations[currentLang].nickname;
            document.getElementById("labelPhone").innerText = translations[currentLang].phone;
            document.getElementById("labelPayment").innerText = translations[currentLang].payment;
            document.getElementById("labelRentalTime").innerText = translations[currentLang].rentalTime;
            document.getElementById("labelNote").innerText = translations[currentLang].note;
            document.querySelector(".button").innerText = translations[currentLang].confirm;
        }

        function confirmBooking() {
            const bikeNumber = document.getElementById("bikeNumber").value;
            const nickname = document.getElementById("nickname").value;
            const phone = document.getElementById("phone").value;
            const payment = document.getElementById("payment").value;
            const rentalTime = document.getElementById("rentalTime").value;
            const note = document.getElementById("note").value;
            const currentTime = new Date().toLocaleTimeString();

            document.getElementById("bookingDetails").innerHTML = `
                <strong>หมายเลขจักรยาน:</strong> ${bikeNumber} <br>
                <strong>ชื่อเล่น:</strong> ${nickname} <br>
                <strong>เบอร์โทร:</strong> ${phone} <br>
                <strong>วิธีชำระเงิน:</strong> ${payment} <br>
                <strong>ระยะเวลาเช่า:</strong> ${rentalTime} <br>
                <strong>หมายเหตุ:</strong> ${note} <br>
                <strong>เวลาจอง:</strong> ${currentTime}
            `;
            document.getElementById("infoBox").style.display = "block";
        }

        function updateTime() {
            document.getElementById("timeDisplay").innerText = "ร้านเปิด 09:00 - ปิด 20:00";
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>

</body>
</html>
