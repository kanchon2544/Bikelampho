<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช่าจักรยาน</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: url(gta.jpg) no-repeat center center/cover;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            position: relative;
        }
        .language-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: white;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        .clock {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
        }
        .container, .receipt {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            text-align: center;
        }
        label {
            display: block;
            text-align: left;
            margin-top: 10px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .hidden {
            display: none;
        }
        .button {
            margin-top: 15px;
            background: #28a745;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }
        .button:hover {
            background: #218838;
        }
    </style>
</head>
<body>

    <button class="language-toggle" id="langToggle">🇹🇭</button>

    <div class="clock" id="clock">--:--:--</div>

    <div class="container" id="bookingForm">
        <h2 id="title">การจองเช่าจักรยาน</h2>

        <label for="bikeNumber" id="labelBike">หมายเลขจักรยาน / สี</label>
        <input type="text" id="bikeNumber">

        <label for="nickname" id="labelName">ชื่อเล่น</label>
        <input type="text" id="nickname">

        <label for="phone" id="labelPhone">เบอร์โทร</label>
        <input type="text" id="phone">

        <label for="payment" id="labelPayment">วิธีชำระเงิน</label>
        <select id="payment">
            <option value="cash">เงินสด</option>
            <option value="transfer">โอนเงิน</option>
        </select>

        <div id="cashAmountDiv" class="hidden">
            <label for="cashAmount" id="labelCash">จำนวนเงิน (บาท)</label>
            <input type="number" id="cashAmount" min="0">
        </div>

        <div id="slipUploadDiv" class="hidden">
            <label for="slipUpload" id="labelSlip">แนบสลิป</label>
            <input type="file" id="slipUpload" accept="image/*">
        </div>

        <button class="button" id="submitButton">ยืนยันการจอง</button>
    </div>

    <div class="receipt hidden" id="receipt">
        <h2>ข้อมูลการเช่า</h2>
        <p><strong>จักรยาน:</strong> <span id="receiptBike"></span></p>
        <p><strong>ชื่อเล่น:</strong> <span id="receiptName"></span></p>
        <p><strong>เบอร์โทร:</strong> <span id="receiptPhone"></span></p>
        <p><strong>วิธีชำระเงิน:</strong> <span id="receiptPayment"></span></p>
        <p><strong>เวลายืนยัน:</strong> <span id="receiptTime"></span></p>
        <button class="button" onclick="location.reload()">กลับไปหน้าหลัก</button>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            let formattedTime = 
                (hours < 10 ? "0" : "") + hours + ":" + 
                (minutes < 10 ? "0" : "") + minutes + ":" + 
                (seconds < 10 ? "0" : "") + seconds;

            document.getElementById("clock").innerText = formattedTime;
        }

        setInterval(updateClock, 1000);
        updateClock();

        document.getElementById("payment").addEventListener("change", function() {
            if (this.value === "cash") {
                document.getElementById("cashAmountDiv").classList.remove("hidden");
                document.getElementById("slipUploadDiv").classList.add("hidden");
            } else {
                document.getElementById("cashAmountDiv").classList.add("hidden");
                document.getElementById("slipUploadDiv").classList.remove("hidden");
            }
        });

        document.getElementById("submitButton").addEventListener("click", function() {
            document.getElementById("bookingForm").classList.add("hidden");
            document.getElementById("receipt").classList.remove("hidden");

            document.getElementById("receiptBike").innerText = document.getElementById("bikeNumber").value;
            document.getElementById("receiptName").innerText = document.getElementById("nickname").value;
            document.getElementById("receiptPhone").innerText = document.getElementById("phone").value;
            document.getElementById("receiptPayment").innerText = document.getElementById("payment").value === "cash" ? "เงินสด" : "โอนเงิน";
            
            let now = new Date();
            document.getElementById("receiptTime").innerText = now.toLocaleTimeString();
        });

        const translations = {
            "th": {
                "title": "การจองเช่าจักรยาน",
                "submitButton": "ยืนยันการจอง"
            },
            "en": {
                "title": "Bicycle Rental Booking",
                "submitButton": "Confirm Booking"
            }
        };

        let currentLang = "th";
        document.getElementById("langToggle").addEventListener("click", function() {
            currentLang = (currentLang === "th") ? "en" : "th";
            this.innerText = (currentLang === "th") ? "🇹🇭" : "🇺🇸";
            document.getElementById("title").innerText = translations[currentLang]["title"];
            document.getElementById("submitButton").innerText = translations[currentLang]["submitButton"];
        });

    </script>

</body>
</html>
